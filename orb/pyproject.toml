[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbbot"
version = "0.1.0"
description = "Opening Range Breakout (ORB/OPR) : backtest exhaustif (grille de variantes, validation hors-échantillon) + moteur temps réel (paper / courtier) partageant le même code de stratégie"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "httpx>=0.27", "typer>=0.12", "pydantic>=2.6", "pydantic-settings>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
orbbot = "orbbot.cli:app"

[tool.setuptools.packages.find]
include = ["orbbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
