[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 2000
via_ir = false
fs_permissions = [{ access = "read", path = "./" }, { access = "read", path = "../devnet/artifacts" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# Fuzz / invariant settings (raise `runs` for deeper campaigns)
[fuzz]
runs = 512
max_test_rejects = 65536

[invariant]
runs = 128
depth = 32
fail_on_revert = false

[profile.ci]
fuzz = { runs = 2048 }
invariant = { runs = 256, depth = 64 }
