name: real-market-ghost

# Session de marché RÉEL (Base mainnet par défaut) en mode ghost : vraies cotations, vrais pools, vrai gaz,
# vraies simulations eth_call contre l'état réel de la chaîne. Lecture seule : aucune clé, aucune transaction.
# Les rapports (JSON/MD/CSV) sont poussés dans docs/reports/real/ sur la branche courante.
#
# Déclenchement : modification de ops/real/run.json (ou de ce fichier), ou lancement manuel.
# Fonctionnement continu : si `continuous` vaut true dans ops/real/run.json (version de la branche au moment de la fin de
# session), la session relance elle-même la suivante (workflow_dispatch) — les sessions s'enchaînent sans chevauchement
# (groupe de concurrence) jusqu'à ce que `continuous` soit remis à false. Limite GitHub : 6 h par job → sessions de 340 min.

on:
  push:
    paths:
      - "ops/real/run.json"
      - ".github/workflows/real-market-ghost.yml"
  workflow_dispatch:
    inputs:
      chain:
        description: "base | arbitrum"
        default: "base"
      minutes:
        description: "durée de la session ghost (minutes)"
        default: "30"
      max_rps:
        description: "limite de requêtes RPC par seconde"
        default: "12"

permissions:
  contents: write
  actions: write

concurrency:
  group: real-market-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ghost:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paramètres
        id: cfg
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = json.load(open("ops/real/run.json"))
          ev = json.loads(os.environ.get("INPUTS_JSON") or "{}") or {}
          chain = ev.get("chain") or cfg.get("chain", "base")
          minutes = ev.get("minutes") or cfg.get("minutes", 30)
          rps = ev.get("max_rps") or cfg.get("max_rps", 12)
          print(f"chain={chain}"); print(f"minutes={minutes}"); print(f"max_rps={rps}")
          EOF
        env:
          INPUTS_JSON: ${{ toJSON(github.event.inputs) }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Backend
        run: python -m pip install -q -e backend

      - name: Foundry (compilation de l'exécuteur pour la simulation par state override)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Dépendances Solidity + build
        working-directory: contracts
        run: |
          mkdir -p lib
          git clone -q --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone -q https://github.com/foundry-rs/forge-std lib/forge-std
          git -C lib/forge-std checkout -q 0258fe875e1d8e207c1eb7175e542ea32356773c || true
          forge --version
          forge build --skip test --skip script
          test -f out/FlashArbExecutor.sol/FlashArbExecutor.json

      - name: Session de marché réel (pré-vol RPC → verify-chain → ghost)
        id: session
        timeout-minutes: 350
        env:
          PYTHONUNBUFFERED: "1"
          ARB_SNAPSHOT_HOOK: "bash ops/real/publish.sh"
        run: |
          set -o pipefail
          mkdir -p docs/reports/real
          git config user.name "real-market-bot"
          git config user.email "actions@users.noreply.github.com"
          python scripts/real_market_session.py --chain "${{ steps.cfg.outputs.chain }}" --minutes "${{ steps.cfg.outputs.minutes }}" \
            --max-rps "${{ steps.cfg.outputs.max_rps }}" --snapshot-every 3 --tag "${{ github.run_id }}" 2>&1 | tee docs/reports/real/session_${{ github.run_id }}.log

      - name: Résumé
        if: always()
        run: |
          {
            echo "## Session de marché réel — run ${{ github.run_id }}"
            ls docs/reports/real/ || true
            for f in docs/reports/real/ghost_*_${{ github.run_id }}.md; do [ -f "$f" ] && cat "$f"; done
            for f in docs/reports/verify_chain_${{ steps.cfg.outputs.chain }}_*.md; do [ -f "$f" ] && tail -n 80 "$f"; done
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Publier les rapports dans la branche
        if: always()
        run: bash ops/real/publish.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-market-${{ github.run_id }}
          path: |
            docs/reports/real/
            docs/reports/verify_chain_*
            data/*.sqlite
          if-no-files-found: warn

      - name: Enchaîner la session suivante (si `continuous` est true dans ops/real/run.json sur la branche)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin "${GITHUB_REF_NAME}"
          cfg="$(git show "origin/${GITHUB_REF_NAME}:ops/real/run.json" 2>/dev/null || cat ops/real/run.json)"
          cont="$(printf '%s' "$cfg" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(str(bool(d.get("continuous", False)) and not bool(d.get("stop", False))).lower())')"
          minutes="$(printf '%s' "$cfg" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("minutes", 340))')"
          chain="$(printf '%s' "$cfg" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("chain", "base"))')"
          rps="$(printf '%s' "$cfg" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("max_rps", 12))')"
          echo "continuous=$cont session_outcome=${{ steps.session.outcome }}"
          if [ "$cont" != "true" ]; then echo "pas d'enchaînement (continuous=false)"; exit 0; fi
          if [ "${{ steps.session.outcome }}" != "success" ]; then echo "session en échec : pause de 10 min avant relance"; sleep 600; fi
          gh workflow run real-market-ghost.yml --ref "${GITHUB_REF_NAME}" -f chain="$chain" -f minutes="$minutes" -f max_rps="$rps" \
            && echo "session suivante demandée" || echo "relance impossible (permissions actions:write ?) — relancer en modifiant ops/real/run.json"
