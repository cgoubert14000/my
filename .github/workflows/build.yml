name: Build executables

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Committer le .exe dans la branche (livraison)"
        type: boolean
        default: false
  push:
    branches:
      - arena/cbaec6f0-my
    paths:
      - "app/**"
      - "tools/build_executable.py"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        shell: bash
        run: |
          set +e
          python tools/build_executable.py > build.log 2>&1
          status=$?
          echo "exit=$status"
          tail -60 build.log
          {
            echo "### Build exit: $status"
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/vinted-sniper.exe -ArgumentList "--no-browser","--port","8123" -PassThru
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8123/api/health
          Write-Host $r.Content
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: vinted-sniper-windows
          path: dist/vinted-sniper.exe
          retention-days: 30
      - name: Publish binary to branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p _delivery
          cp dist/vinted-sniper.exe _delivery/vinted-sniper.exe
          git add -f _delivery/vinted-sniper.exe
          git commit -m "chore(build): binaire Windows temporaire [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Publish build log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f build.log ]; then
            {
              echo "### Build Windows — journal ($(git rev-parse --short HEAD))"
              echo '```'
              tail -45 build.log
              echo '```'
            } > report.md
            pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
            if [ -n "$pr" ]; then gh pr comment "$pr" --body-file report.md || true; fi
          fi

  linux:
    name: Linux (binaire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        shell: bash
        run: |
          set +e
          python tools/build_executable.py > build.log 2>&1
          status=$?
          echo "exit=$status"
          tail -60 build.log
          {
            echo "### Build exit: $status"
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Smoke test
        run: |
          ./dist/vinted-sniper --no-browser --port 8124 &
          sleep 12
          curl -fsS http://127.0.0.1:8124/api/health
      - uses: actions/upload-artifact@v4
        with:
          name: vinted-sniper-linux
          path: dist/vinted-sniper
          retention-days: 30
