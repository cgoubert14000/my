name: Build executables

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Committer le .exe dans la branche (livraison)"
        type: boolean
        default: false
  push:
    branches:
      - arena/cbaec6f0-my
    paths:
      - "app/**"
      - "tools/build_executable.py"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        shell: bash
        run: |
          set +e
          python tools/build_executable.py > build.log 2>&1
          status=$?
          echo "exit=$status"
          tail -60 build.log
          {
            echo "### Build exit: $status"
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/vinted-sniper.exe -ArgumentList "--no-browser","--port","8123" -PassThru
          Start-Sleep -Seconds 15
          $health = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8123/api/health
          Write-Host $health.Content
          $index = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8123/
          if ($index.Content -notmatch "Vinted Sniper") { throw "Dashboard absent de l'executable" }
          $js = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8123/static/app.js
          if ($js.Content -notmatch "splitSearchUrl") { throw "JS du dashboard absent" }
          $cats = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8123/api/categories
          if ($cats.Content -notmatch "women_root") { throw "Categories absentes" }
          Write-Host "Dashboard, JS et categories OK dans l'executable"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: vinted-sniper-windows
          path: dist/vinted-sniper.exe
          retention-days: 30
      - name: Publish build log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f build.log ]; then
            {
              echo "### Build Windows — journal ($(git rev-parse --short HEAD))"
              echo '```'
              tail -45 build.log
              echo '```'
            } > report.md
            pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
            if [ -n "$pr" ]; then gh pr comment "$pr" --body-file report.md || true; fi
          fi

  linux:
    name: Linux (binaire)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        shell: bash
        run: |
          set +e
          python tools/build_executable.py > build.log 2>&1
          status=$?
          echo "exit=$status"
          tail -60 build.log
          {
            echo "### Build exit: $status"
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Smoke test
        run: |
          ./dist/vinted-sniper --no-browser --port 8124 &
          sleep 12
          curl -fsS http://127.0.0.1:8124/api/health
      - uses: actions/upload-artifact@v4
        with:
          name: vinted-sniper-linux
          path: dist/vinted-sniper
          retention-days: 30
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vinted-sniper-windows
          path: _win
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Publish binaries to branch
        if: github.ref == 'refs/heads/arena/cbaec6f0-my'
        run: |
          mkdir -p _delivery
          cp dist/vinted-sniper _delivery/vinted-sniper-linux
          if [ -f _win/vinted-sniper.exe ]; then
            cp _win/vinted-sniper.exe _delivery/vinted-sniper.exe
          else
            echo "::warning::binaire Windows non recupere"
          fi
          if git ls-files --error-unmatch _delivery/vinted-sniper.exe _delivery/vinted-sniper-linux >/dev/null 2>&1; then
            echo "Binaires deja suivis."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _delivery/vinted-sniper.exe _delivery/vinted-sniper-linux
          if git diff --cached --quiet; then echo "Binaires deja a jour."; exit 0; fi
          git commit -m "chore(build): binaires Windows et Linux [skip ci]"
          for attempt in 1 2 3; do
            git push origin "HEAD:$GITHUB_REF_NAME" && { echo "Publie (tentative $attempt)."; exit 0; }
            git pull --rebase origin "$GITHUB_REF_NAME" || git rebase --abort || true
            sleep 5
          done
          echo "Publication impossible."; exit 1
