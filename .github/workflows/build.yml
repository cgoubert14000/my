name: Build executables

on:
  workflow_dispatch:
  push:
    branches:
      - arena/cbaec6f0-my
    paths:
      - "app/**"
      - "tools/build_executable.py"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        shell: bash
        run: |
          set +e
          python tools/build_executable.py > build.log 2>&1
          status=$?
          echo "exit=$status"
          tail -60 build.log
          {
            echo "### Build exit: $status"
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/vinted-sniper.exe -ArgumentList "--no-browser","--port","8123" -PassThru
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8123/api/health
          Write-Host $r.Content
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: vinted-sniper-windows
          path: dist/vinted-sniper.exe
          retention-days: 30

  linux:
    name: Linux (binaire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        shell: bash
        run: |
          set +e
          python tools/build_executable.py > build.log 2>&1
          status=$?
          echo "exit=$status"
          tail -60 build.log
          {
            echo "### Build exit: $status"
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Smoke test
        run: |
          ./dist/vinted-sniper --no-browser --port 8124 &
          sleep 12
          curl -fsS http://127.0.0.1:8124/api/health
      - uses: actions/upload-artifact@v4
        with:
          name: vinted-sniper-linux
          path: dist/vinted-sniper
          retention-days: 30
