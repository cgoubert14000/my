name: Build executables

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Committer le .exe dans la branche (livraison)"
        type: boolean
        default: false
  push:
    branches:
      - arena/cbaec6f0-my
    paths:
      - "app/**"
      - "tools/build_executable.py"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        shell: bash
        run: |
          set +e
          python tools/build_executable.py > build.log 2>&1
          status=$?
          echo "exit=$status"
          tail -60 build.log
          {
            echo "### Build exit: $status"
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/vinted-sniper.exe -ArgumentList "--no-browser","--port","8123" -PassThru
          Start-Sleep -Seconds 15
          $health = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8123/api/health
          Write-Host $health.Content
          $index = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8123/
          if ($index.Content -notmatch "Vinted Sniper") { throw "Dashboard absent de l'executable" }
          $js = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8123/static/app.js
          if ($js.Content -notmatch "splitSearchUrl") { throw "JS du dashboard absent" }
          $cats = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8123/api/categories
          if ($cats.Content -notmatch "women_root") { throw "Categories absentes" }
          Write-Host "Dashboard, JS et categories OK dans l'executable"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: vinted-sniper-windows
          path: dist/vinted-sniper.exe
          retention-days: 30
      - name: Publish binary to branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/cbaec6f0-my'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            mkdir -p _delivery
            cp dist/vinted-sniper.exe _delivery/vinted-sniper.exe
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f _delivery/vinted-sniper.exe
            git status --short
            if git diff --cached --quiet; then echo "DEJA_A_JOUR"; exit 0; fi
            git commit -m "chore(build): binaire Windows [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          } > publish.log 2>&1
          status=$?
          echo "exit=$status"
          tail -40 publish.log
          {
            echo "### Publication du binaire : exit $status"
            echo '```'
            tail -40 publish.log
            echo '```'
          } > publish-report.md
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          if [ -n "$pr" ]; then gh pr comment "$pr" --body-file publish-report.md || true; fi
          exit $status
      - name: Publish build log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f build.log ]; then
            {
              echo "### Build Windows — journal ($(git rev-parse --short HEAD))"
              echo '```'
              tail -45 build.log
              echo '```'
            } > report.md
            pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
            if [ -n "$pr" ]; then gh pr comment "$pr" --body-file report.md || true; fi
          fi

  linux:
    name: Linux (binaire)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        shell: bash
        run: |
          set +e
          python tools/build_executable.py > build.log 2>&1
          status=$?
          echo "exit=$status"
          tail -60 build.log
          {
            echo "### Build exit: $status"
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Smoke test
        run: |
          ./dist/vinted-sniper --no-browser --port 8124 &
          sleep 12
          curl -fsS http://127.0.0.1:8124/api/health
      - uses: actions/upload-artifact@v4
        with:
          name: vinted-sniper-linux
          path: dist/vinted-sniper
          retention-days: 30
