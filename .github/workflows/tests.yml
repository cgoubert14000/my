name: tests

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer la suite (aucun réseau externe requis)
        env:
          TESTS_STALL_TIMEOUT: "240"
        run: |
          set -o pipefail
          python tools/run_tests.py 2>&1 | tee tests-run.log

      - name: Rapport d'échec (PR + fichier suivi)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Tests en échec — $(git rev-parse --short HEAD) — $(date -u +%H:%M:%SZ)"
            echo '```'
            tail -45 tests-run.log || echo "aucune trace disponible" 
            echo '```'
          } > report.md
          cat report.md
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number' || true)
          if [ -n "$pr" ]; then gh pr comment "$pr" --body-file report.md || true; fi
          cp report.md .ci-tests-report.md
          git config user.name "vinted-sniper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f .ci-tests-report.md
          git commit -m "ci(report): trace d'echec des tests [skip ci]" || exit 0
          git push || true
