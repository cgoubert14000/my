name: tests

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer la suite (aucun réseau externe requis)
        env:
          TESTS_STALL_TIMEOUT: "240"
        run: python tools/run_tests.py

      - name: Rapport d'échec (commentaire sur la PR)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Tests en échec — $(git rev-parse --short HEAD)"
            echo '```'
            timeout 320 python tools/run_tests.py 2>&1 | tail -45
            echo '```'
          } > report.md
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          if [ -n "$pr" ]; then gh pr comment "$pr" --body-file report.md || true; fi
