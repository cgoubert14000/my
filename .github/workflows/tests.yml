name: tests

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lancer la suite (aucun réseau externe requis)
        run: python -m unittest discover -s tests -v

      - name: Rapport d'échec (commentaire sur la PR)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Tests en échec — $(git rev-parse --short HEAD)"
            echo '```'
            timeout 300 python -m unittest discover -s tests 2>&1 | tail -40
            echo '```'
          } > report.md
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          if [ -n "$pr" ]; then gh pr comment "$pr" --body-file report.md || true; fi
