name: memecoin-check

# Vérification « bot memecoin » sur données RÉELLES (Base) : paires créées, retraits de liquidité, P&L exact d'un sniper
# naïf. Lecture seule : aucune clé, aucune transaction. Déclenchement : modification de ops/real/memecoin.json ou manuel.

on:
  push:
    paths:
      - "ops/real/memecoin.json"
      - ".github/workflows/memecoin-check.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "fenêtre (jours)"
        default: "2"
      max_pairs:
        description: "paires analysées au maximum (échantillon uniforme)"
        default: "300"

permissions:
  contents: write

concurrency:
  group: memecoin-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dépendances
        run: python -m pip install -q -e backend
      - name: Paramètres
        id: cfg
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d = json.load(open("ops/real/memecoin.json"))
          days = os.environ.get("IN_DAYS") or d.get("days", 2)
          mp = os.environ.get("IN_MAX_PAIRS") or d.get("max_pairs", 300)
          print(f"chain={d.get('chain', 'base')}")
          print(f"days={days}")
          print(f"max_pairs={mp}")
          print(f"buy_eth={d.get('buy_eth', 0.005)}")
          PY
        env:
          IN_DAYS: ${{ github.event.inputs.days }}
          IN_MAX_PAIRS: ${{ github.event.inputs.max_pairs }}
      - name: Prix ETH (dernier instantané de session réelle, à défaut vide)
        id: px
        run: |
          px=$(python3 -c "import json;print(json.load(open('docs/reports/real/latest_${{ steps.cfg.outputs.chain }}.json')).get('native_price_usd') or 0)" 2>/dev/null || echo 0)
          echo "eth_usd=$px" >> "$GITHUB_OUTPUT"
      - name: Vérification memecoin (lecture seule)
        env:
          ARB_RPC_ARCHIVE_URL: ${{ secrets.RPC_ARCHIVE_URL_BASE }}
        run: |
          python scripts/memecoin_reality_check.py --chain "${{ steps.cfg.outputs.chain }}" --days "${{ steps.cfg.outputs.days }}" \
            --max-pairs "${{ steps.cfg.outputs.max_pairs }}" --buy-eth "${{ steps.cfg.outputs.buy_eth }}" \
            --eth-usd "${{ steps.px.outputs.eth_usd }}" --tag "${{ github.run_id }}" 2>&1 | tee docs/reports/real/memecoin_session_${{ github.run_id }}.log
      - name: Publier le rapport dans la branche
        if: always()
        run: bash ops/real/publish.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memecoin-check-${{ github.run_id }}
          path: docs/reports/real/memecoin_*
          if-no-files-found: warn
